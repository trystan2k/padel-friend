name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same PR/ref add no required-gate evidence; stop them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Branch-protection rollout: repo admin must replace the old `CI / checks` required
# context with the single `CI / gate` context after this workflow is available.
# This admin change cannot be made from the workflow.
# Before: 39m33s wall (run 40183330593: build + unit 88.55s, integration 1292.99s,
# E2E ~11m40s, serialized in one job). After: projected wall ≈ slowest job, with
# integration expected to dominate and transport work expected to cut its time sharply;
# the first CI run will provide actuals.
# Compute cost should rise slightly because isolated jobs repeat setup.
jobs:
  # Independent jobs use `!cancelled()` so one phase failure does not suppress peers.
  # Each job owns its runner; integration and E2E never share a mutable Supabase DB.
  checks:
    name: checks
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep the populated predecessor upgrade proof and latest-schema reset in CI.
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Test populated predecessor migration upgrade
        id: populated-upgrade
        env:
          POPULATED_UPGRADE_OPT_IN: '1'
        run: node scripts/test-populated-migration-up.mjs
        continue-on-error: true
      - name: Restore latest local Supabase schema
        id: final-reset
        if: always()
        run: pnpm exec supabase db reset --local
        continue-on-error: true
      - name: Enforce populated upgrade and final reset results
        if: always()
        run: |
          if [[ "${{ steps.populated-upgrade.outcome }}" == "failure" || "${{ steps.final-reset.outcome }}" == "failure" ]]; then
            printf '%s\n' 'Populated migration upgrade or latest-schema restore failed' >&2
            exit 1
          fi
      - name: Provision local Supabase environment
        run: |
          set -euo pipefail
          status="$(pnpm exec supabase status -o env)"
          API_URL="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | tail -n 1)"
          PUBLISHABLE_KEY="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY=//p' | tail -n 1)"
          API_URL="${API_URL#\"}"
          API_URL="${API_URL%\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY#\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY%\"}"
          if [[ -z ${API_URL:-} || ! ${API_URL:-} =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]+/?$ || -z ${PUBLISHABLE_KEY:-} ]]; then
            printf '%s\n' 'Local Supabase API_URL or PUBLISHABLE_KEY missing/invalid' >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
      - name: Check generated database types
        run: pnpm db:types:check
      - run: pnpm build
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Record checks timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"checks","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/checks-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-evidence
          path: artifacts/checks-timing.json
          if-no-files-found: ignore

  # Unit tests own coverage collection; thresholds remain in vitest.config.ts.
  unit:
    name: unit
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage and JSON report
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start_ms="$(date +%s%3N)"
          if pnpm exec vitest run --config vitest.unit.config.ts --coverage --reporter=default --reporter=json --outputFile.json=artifacts/unit-report.json; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"unit","elapsedMs":%s,"exitCode":%s}\n' "$elapsed_ms" "$test_exit_code" > artifacts/unit-timing.json
          exit "$test_exit_code"
      - name: Record unit job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"unit","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/unit-job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: |
            coverage/
            artifacts/unit-report.json
            artifacts/unit-timing.json
            artifacts/unit-job-timing.json
          if-no-files-found: ignore

  # One disposable local Supabase stack; no other job can mutate this runner's DB.
  integration:
    name: integration
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Ensure latest local Supabase schema
        run: pnpm exec supabase db reset --local
      - name: Provision local Supabase environment
        run: |
          set -euo pipefail
          status="$(pnpm exec supabase status -o env)"
          API_URL="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | tail -n 1)"
          PUBLISHABLE_KEY="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY=//p' | tail -n 1)"
          API_URL="${API_URL#\"}"
          API_URL="${API_URL%\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY#\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY%\"}"
          if [[ -z ${API_URL:-} || ! ${API_URL:-} =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]+/?$ || -z ${PUBLISHABLE_KEY:-} ]]; then
            printf '%s\n' 'Local Supabase API_URL or PUBLISHABLE_KEY missing/invalid' >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
      - name: Run integration tests with JSON report
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start_ms="$(date +%s%3N)"
          if pnpm exec vitest run --config vitest.integration.config.ts --reporter=default --reporter=json --outputFile.json=artifacts/integration-report.json; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"integration","elapsedMs":%s,"exitCode":%s}\n' "$elapsed_ms" "$test_exit_code" > artifacts/integration-timing.json
          exit "$test_exit_code"
      - name: Record integration job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"integration","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/integration-job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/integration-report.json
            artifacts/integration-timing.json
            artifacts/integration-job-timing.json
          if-no-files-found: ignore

  # E2E gets a separate stack and fresh preview. Run only pnpm test:e2e here;
  # never place mutation-heavy unit/integration suites in this job.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start
      - name: Ensure latest local Supabase schema
        run: pnpm exec supabase db reset --local
      - name: Provision local Supabase environment
        run: |
          set -euo pipefail
          status="$(pnpm exec supabase status -o env)"
          API_URL="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p' | tail -n 1)"
          PUBLISHABLE_KEY="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY=//p' | tail -n 1)"
          API_URL="${API_URL#\"}"
          API_URL="${API_URL%\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY#\"}"
          PUBLISHABLE_KEY="${PUBLISHABLE_KEY%\"}"
          if [[ -z ${API_URL:-} || ! ${API_URL:-} =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]+/?$ || -z ${PUBLISHABLE_KEY:-} ]]; then
            printf '%s\n' 'Local Supabase API_URL or PUBLISHABLE_KEY missing/invalid' >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run fresh-preview E2E
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start_ms="$(date +%s%3N)"
          if pnpm test:e2e; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"e2e","elapsedMs":%s,"exitCode":%s}\n' "$elapsed_ms" "$test_exit_code" > artifacts/e2e-timing.json
          exit "$test_exit_code"
      - name: Record E2E job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"e2e","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/e2e-job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            test-results/
            artifacts/community-admin-visual/
            artifacts/e2e-timing.json
            artifacts/e2e-job-timing.json
          if-no-files-found: ignore

  # Only this check should be required by branch protection. Every phase must succeed;
  # failures, cancellations, and unexpected skips all fail the aggregate.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [checks, unit, integration, e2e]
    if: ${{ always() }}
    steps:
      - name: Require every CI phase to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'CI results: checks=%s unit=%s integration=%s e2e=%s\n' "$CHECKS_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$E2E_RESULT"
          if [[ "$CHECKS_RESULT" != success || "$UNIT_RESULT" != success || "$INTEGRATION_RESULT" != success || "$E2E_RESULT" != success ]]; then
            printf '%s\n' 'Required CI job failed, was cancelled, or was unexpectedly skipped' >&2
            exit 1
          fi
