name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same PR/ref add no required-gate evidence; stop them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI topology: static checks block the parallel test phases; checks aggregates all results.
# Keep `checks` as final job name for branch-protection continuity.
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    outputs:
      populated-upgrade: ${{ steps.upgrade-paths.outputs.run }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Static stays service-free (no containers, no stack). Vite embeds the public, local-only pair of the
      # test stack (API 55421) from the checked-in descriptor at build time, so the one shared build
      # serves every E2E stack; each E2E lane verifies its live stack reports exactly this pair.
      - name: Resolve public test build config
        run: node scripts/ci-test-env.mjs build-env >> "$GITHUB_ENV"
      - name: Build once for unit and E2E jobs
        env:
          VITE_SUPABASE_URL: ${{ env.BUILD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.BUILD_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm build
      - name: Package shared build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-build"
          # Build output, Cloudflare preview metadata and the generated files unit tests import.
          tar -cf "$RUNNER_TEMP/app-build/app-build.tar" dist .wrangler/deploy/config.json src/routeTree.gen.ts design-tokens/dist
          # Manifest: SHA, run id and the public pair baked into the build; no private values.
          node scripts/ci-test-env.mjs manifest "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/app-build/build-manifest.json"
      - name: Upload shared build
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build/
          retention-days: 1
          if-no-files-found: error
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The populated-upgrade harness only depends on migrations, seeds, config (dev and the test stack
      # project/launcher modules it runs through), its own scripts and fixtures, the toolchain pins and this workflow. Anything unknown or unreadable runs it.
      - name: Detect populated-upgrade inputs
        id: upgrade-paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]] && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            # --no-renames lists both endpoints of a move, so leaving a watched path still counts.
            if changed="$(git diff --name-only --no-renames "$BASE_SHA" HEAD)"; then
              run=false
              pattern='^(supabase/|test/stack/|scripts/test-stack|scripts/test-populated-migration-up\.|test/fixtures/|test/matches\.migration-up-harness\.test\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$|\.github/actions/)'
              if grep -Eq "$pattern" <<<"$changed"; then run=true; fi
            fi
          fi
          printf 'Populated upgrade harness required: %s\n' "$run"
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"
      - name: Record static job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"static","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/static-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-evidence
          path: artifacts/static-timing.json
          if-no-files-found: ignore

  # Unit tests own coverage collection; thresholds remain in vitest.config.ts.
  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit tests import generated route metadata and design tokens; unpack them from the
      # same-run build instead of rebuilding.
      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build
      - name: Verify and unpack shared build
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/app-build/build-manifest.json"
          built_sha="$(node -p "require(process.argv[1]).sha" "$manifest")"
          if [[ "$built_sha" != "$GITHUB_SHA" ]]; then
            printf 'Shared build is for %s but this job runs %s\n' "$built_sha" "$GITHUB_SHA" >&2
            exit 1
          fi
          tar -xf "$RUNNER_TEMP/app-build/app-build.tar"
          test -f dist/server/wrangler.json && test -f .wrangler/deploy/config.json && test -f src/routeTree.gen.ts && test -f design-tokens/dist/tokens.css
      - name: Run unit tests with coverage and JSON report
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start_ms="$(date +%s%3N)"
          if pnpm exec vitest run --config vitest.unit.config.ts --coverage --reporter=default --reporter=json --outputFile.json=artifacts/unit-report.json; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"unit","elapsedMs":%s,"exitCode":%s}\n' "$elapsed_ms" "$test_exit_code" > artifacts/unit-timing.json
          exit "$test_exit_code"
      - name: Record unit job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"unit","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/unit-job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: |
            coverage/
            artifacts/unit-report.json
            artifacts/unit-timing.json
            artifacts/unit-job-timing.json
          if-no-files-found: ignore

  # One disposable local TEST Supabase stack (pnpm test:stack:up); no dev stack exists on CI and no
  # other job can mutate this runner's DB.
  # Integration tests exercise DB-backed feature modules, not build-generated route/token artifacts.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        uses: ./.github/actions/supabase-start
        with:
          save: 'true'
      # Skipped (not failed) unless a populated-upgrade input changed; see the static job.
      - name: Test populated predecessor migration upgrade
        id: populated-upgrade
        if: needs.static.outputs.populated-upgrade == 'true'
        env:
          POPULATED_UPGRADE_OPT_IN: '1'
        run: node scripts/test-populated-migration-up.mjs
        continue-on-error: true
      - name: Restore latest local Supabase schema
        id: final-reset
        if: always() && needs.static.outputs.populated-upgrade == 'true'
        run: pnpm db:reset
        continue-on-error: true
      - name: Enforce populated upgrade and final reset results
        if: always()
        run: |
          if [[ "${{ steps.populated-upgrade.outcome }}" == "failure" || "${{ steps.final-reset.outcome }}" == "failure" ]]; then
            printf '%s\n' 'Populated migration upgrade or latest-schema restore failed' >&2
            exit 1
          fi
      # `db:types:check` generates types from the test stack's schema, so it needs this live stack.
      - name: Check generated database types
        run: pnpm db:types:check
      # The integration launcher (pnpm test:integration) resolves the test stack tuple itself and
      # aborts when the stack is missing; nothing is written to a root .env.
      # Audited parallel-safe files run on 2 workers first, then the remaining files serially
      # (scripts/run-integration.mjs); one JSON report per phase. INTEGRATION_SERIAL=1 is the rollback.
      - name: Run integration tests with JSON report
        run: |
          set -euo pipefail
          mkdir -p artifacts
          start_ms="$(date +%s%3N)"
          if pnpm test:integration --reporter=default --reporter=json --outputFile.json=artifacts/integration-report.json; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"integration","elapsedMs":%s,"exitCode":%s}\n' "$elapsed_ms" "$test_exit_code" > artifacts/integration-timing.json
          exit "$test_exit_code"
      - name: Record integration job timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"integration","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/integration-job-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/integration-report*.json
            artifacts/integration-timing.json
            artifacts/integration-job-timing.json
          if-no-files-found: ignore

  # Each E2E lane gets its own TEST Supabase stack (pnpm test:stack:up) and a fresh preview of the shared same-run build.
  # Three functional lanes are balanced by measured runtime (scripts/e2e-shards.mjs); the serial lane
  # isolates the specs that race on global state (SERIAL_SPECS in scripts/e2e-shards.mjs); the visual lane runs every @visual test on every PR and
  # main push. The reporting job merges their blob
  # reports; checks aggregates the lane results directly.
  # Never place mutation-heavy unit/integration suites in this job.
  e2e:
    name: e2e (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: static
    env:
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.lane }}.zip
    strategy:
      fail-fast: false
      matrix:
        lane: [functional-1, functional-2, functional-3, serial, visual]
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download shared build
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build
      - name: Verify and unpack shared build
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/app-build/build-manifest.json"
          built_sha="$(node -p "require(process.argv[1]).sha" "$manifest")"
          if [[ "$built_sha" != "$GITHUB_SHA" ]]; then
            printf 'Shared build is for %s but this job runs %s\n' "$built_sha" "$GITHUB_SHA" >&2
            exit 1
          fi
          tar -xf "$RUNNER_TEMP/app-build/app-build.tar"
          test -f dist/server/wrangler.json && test -f .wrangler/deploy/config.json && test -f src/routeTree.gen.ts && test -f design-tokens/dist/tokens.css
      - name: Start local Supabase
        uses: ./.github/actions/supabase-start
      # The live test stack must report exactly the public pair baked into the shared build (manifest,
      # cross-checked against the checked-in descriptor). Only the per-run extracted
      # dist/server/.dev.vars receives the masked service key; the keyless artifact never does, and no
      # root .env is written (pnpm test:e2e resolves the tuple through the central test launcher).
      - name: Provision local Supabase environment
        run: node scripts/ci-test-env.mjs provision-e2e "$RUNNER_TEMP/app-build/build-manifest.json" dist/server/.dev.vars
      - run: pnpm exec playwright install --with-deps chromium
      # `pnpm test:e2e` resets the database and frees the preview port itself; E2E_GATE_PREBUILT makes
      # the web server preview the verified same-run build instead of rebuilding per lane.
      - name: Run fresh-preview E2E lane
        env:
          E2E_GATE_PREBUILT: '1'
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Plain redirect (not process substitution) so a planner failure aborts the lane under set -e.
          node scripts/e2e-shards.mjs "$LANE" > "$RUNNER_TEMP/lane-args.txt"
          mapfile -t lane_args < "$RUNNER_TEMP/lane-args.txt"
          if [[ ${#lane_args[@]} -eq 0 ]]; then
            printf 'E2E lane planner returned no args for %s\n' "$LANE" >&2
            exit 1
          fi
          start_ms="$(date +%s%3N)"
          if pnpm test:e2e "${lane_args[@]}" --reporter=blob; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"phase":"e2e","lane":"%s","elapsedMs":%s,"exitCode":%s}\n' "$LANE" "$elapsed_ms" "$test_exit_code" > artifacts/e2e-timing.json
          exit "$test_exit_code"
      - name: Record E2E lane timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LANE: ${{ matrix.lane }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"e2e","lane":"%s","status":"%s","elapsedMs":%s}\n' "$LANE" "$JOB_STATUS" "$elapsed_ms" > artifacts/e2e-job-timing.json
      - name: Upload E2E blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-blob-report-${{ matrix.lane }}
          path: blob-report/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence-${{ matrix.lane }}
          path: |
            test-results/
            artifacts/community-admin-visual/
            artifacts/e2e-timing.json
            artifacts/e2e-job-timing.json
          if-no-files-found: ignore

  # Merge reports after all lanes finish, without affecting the required checks gate.
  e2e-report:
    name: e2e-report
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download E2E lane blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Require all five lane reports
        run: |
          set -euo pipefail
          if [[ ! -d all-blob-reports ]]; then
            printf '%s\n' 'No E2E blob reports were downloaded' >&2
            exit 1
          fi
          report_count="$(find all-blob-reports -type f -name '*.zip' | wc -l | tr -d '[:space:]')"
          if [[ "$report_count" -ne 5 ]]; then
            printf 'Expected one blob report from each of 5 E2E lanes; found %s\n' "$report_count" >&2
            exit 1
          fi
      - name: Merge E2E HTML report
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-html-report
          path: playwright-report/
          if-no-files-found: ignore

  # Final aggregate preserves the full CI result for branch protection.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [static, unit, integration, e2e]
    if: ${{ always() }}
    steps:
      - name: Start job timing
        run: printf '%s\n' "$(date +%s%3N)" > "$RUNNER_TEMP/ci-job-start-ms"
      - name: Require every CI phase to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          printf 'CI results: static=%s unit=%s integration=%s e2e=%s\n' "$STATIC_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$E2E_RESULT"
          if [[ "$STATIC_RESULT" != success || "$UNIT_RESULT" != success || "$INTEGRATION_RESULT" != success || "$E2E_RESULT" != success ]]; then
            printf '%s\n' 'Required CI phase failed, was cancelled, or was unexpectedly skipped' >&2
            exit 1
          fi
      - name: Record checks timing
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts
          start_ms="$(cat "$RUNNER_TEMP/ci-job-start-ms")"
          elapsed_ms=$(( $(date +%s%3N) - start_ms ))
          printf '{"job":"checks","status":"%s","elapsedMs":%s}\n' "$JOB_STATUS" "$elapsed_ms" > artifacts/checks-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-evidence
          path: artifacts/checks-timing.json
          if-no-files-found: ignore
