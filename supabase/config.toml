project_id = "padel-friend"

[api]
port = 55321

[db]
port = 55322

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
port = 55327

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:4173/auth/callback",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:4173/**"
]

[auth.email]
# Local only: makes the starter auth/notes example immediately testable.
enable_confirmations = false

# Invitation email for players added by name and email. One template serves every
# locale: the server renders localized copy per send into the invite `data`
# (see src/features/matches/invitation-email.ts).
[auth.email.template.invite]
subject = "{{ .Data.padel_invite_subject }}"
content_path = "./supabase/templates/invite.html"

# Controlled OAuth provider for the provisional-claim integration tests only
# (test/helpers/controlled-oauth-provider.ts). Auth runs the real OAuth + identity
# linking code against a stub that the test process serves on this fixed port, so no
# external Google client is needed. Unreachable provider => those tests skip.
[auth.external.keycloak]
enabled = true
client_id = "padel-controlled-provider"
secret = "padel-controlled-provider-secret"
url = "http://host.docker.internal:55399/realms/controlled"
redirect_uri = "http://127.0.0.1:55321/auth/v1/callback"
skip_nonce_check = true

# Optional local Google OAuth: uncomment after supplying both environment variables
# in the shell running `pnpm db:start`. Keep the client secret out of this file.
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false
