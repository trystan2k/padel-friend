# Isolated TEST Supabase stack (PAF-124). A second normal CLI project, selected only through
# `--workdir <repo>/test/stack` by scripts/test-stack.mjs. Dev project config is supabase/config.toml.
# Differences from it are intentional: project_id, host ports and the controlled OAuth endpoint.
# migrations/ and seed.sql are relative symlinks to the canonical supabase/ files. templates/ is a
# tracked copy: the CLI rejects template paths that resolve outside the project root (symlinks
# included); test/test-stack.test.ts keeps it byte-identical to supabase/templates.
project_id = "padel-friend-test"

[api]
port = 55421

[db]
port = 55422
shadow_port = 55420

# Reserved (not used by tests); explicit so the CLI default 54329 never binds.
[db.pooler]
enabled = false
port = 55429

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 55423

# Mailpit web/API. SMTP/POP3 stay unpublished (CLI default), same as the dev stack.
[local_smtp]
port = 55424

[analytics]
port = 55427

# Explicit so the CLI default inspector port 8083 never binds.
[edge_runtime]
inspector_port = 55483

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:4173/auth/callback",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:4173/**"
]

[auth.email]
# Local only: makes the starter auth/notes example immediately testable.
enable_confirmations = false

# Invitation email for players added by name and email. One template serves every
# locale: the server renders localized copy per send into the invite `data`
# (see src/features/matches/invitation-email.ts).
[auth.email.template.invite]
subject = "{{ .Data.padel_invite_subject }}"
content_path = "./supabase/templates/invite.html"

# Controlled OAuth provider for the provisional-claim integration tests only
# (test/helpers/controlled-oauth-provider.ts). Auth runs the real OAuth + identity
# linking code against a stub that the test process serves on this fixed port, so no
# external Google client is needed. Unreachable provider => those tests skip.
[auth.external.keycloak]
enabled = true
client_id = "padel-controlled-provider"
secret = "padel-controlled-provider-secret"
url = "http://host.docker.internal:55499/realms/controlled"
redirect_uri = "http://127.0.0.1:55421/auth/v1/callback"
skip_nonce_check = true
