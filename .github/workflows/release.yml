name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
      - name: Record immutable release identity
        id: identity
        if: steps.release.outputs.release_created == 'true'
        run: node scripts/production-release-guard.mjs record
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
  deploy:
    name: Production ${{ needs.release.outputs.tag }} @ ${{ needs.release.outputs.release_sha }}
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: padel-friend-production-release
      cancel-in-progress: false
    env:
      RELEASE_CREATED: ${{ needs.release.outputs.created }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
    steps:
      # GitHub production approval gates every step, including checkout.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
      - name: Validate approved identity and freshness
        run: node scripts/production-release-guard.mjs verify
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert pinned Supabase CLI
        run: test "$(pnpm exec supabase --version)" = '2.121.0'
      - name: Check production credential presence
        run: node scripts/production-release-guard.mjs credentials
        env:
          # Validate presence without exposing private values before the migration/deploy steps.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && 'present' || '' }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' && 'present' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'present' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'present' || '' }}
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Apply approved pending production migrations
        id: migrations
        run: |
          node scripts/production-release-guard.mjs verify
          node scripts/production-migrations.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Presence markers only; actual Cloudflare values never enter migration processes.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'present' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'present' || '' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Revalidate identity and freshness before Worker deployment
        run: node scripts/production-release-guard.mjs verify
      - run: pnpm exec wrangler deploy
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report incomplete production release
        if: always() && (steps.migrations.outcome == 'failure' || (steps.migrations.outcome == 'success' && steps.worker.outcome != 'success'))
        run: |
          printf '%s\n' 'Production release incomplete after migration step. Schema may be ahead or partially changed. Review applied history and Worker version before retrying.' >> "$GITHUB_STEP_SUMMARY"
